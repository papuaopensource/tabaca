[project]
name = "tabaca-backend"
version = "0.1.0"
description = "Tabaca — backend API & admin for Papua stories"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "django-unfold>=0.42",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "djangorestframework-camel-case>=1.4",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dateutil>=2.9",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-django>=4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_project.settings"
python_files = ["tests.py", "test_*.py"]
