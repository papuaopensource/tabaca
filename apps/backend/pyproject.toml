[project]
name = "tabaca-backend"
version = "0.1.0"
description = "Tabaca — backend API & admin for Papua stories"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<7",
    "djangorestframework>=3.18",
    "django-unfold>=0.110",
    "django-cors-headers>=4.9",
    "django-filter>=26.2",
    "djangorestframework-camel-case>=1.4.2",
    "feedparser>=6.0.14",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "python-decouple>=3.8",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pytest>=9.2",
    "pytest-django>=4.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_project.settings.development"
python_files = ["tests.py", "test_*.py"]
